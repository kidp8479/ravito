server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path serves index.html so client-side
    # routing (React Router or similar) handles it, instead of nginx
    # returning a 404 on a direct hit to e.g. /movies/42.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
