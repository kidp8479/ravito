# Production compose file (ADR 0004): the Droplet-only counterpart to
# docker-compose.yml. Not an override of that file - dev bind-mounts
# source and runs watch-mode servers (`target: dev`), prod needs built
# images and no bind mounts, different enough to keep as its own file.
#
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# See docs/deployment.md for the full runbook (Droplet setup, DNS, first deploy).
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    # Never publish a port here: Postgres must stay reachable only from
    # other containers on this compose network, never from the host's
    # public interface (docs/deployment.md's security checklist).

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      FRONTEND_ORIGIN: https://${APP_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PORT: 3000
    # Bound to loopback only: the public interface is Caddy's job. Caddy
    # reaches this over the compose network by service name, not this
    # published port - it's here so `docker compose exec`/host-side
    # debugging can reach it without opening it up publicly.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    # No published port: Caddy proxies to this container by service name
    # over the compose network, same as backend.

  caddy:
    image: docker.io/library/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
