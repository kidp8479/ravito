# Dev-only compose file: all services target `dev` (hot-reload, bind-mounted
# source). A prod-targeted variant is a later concern (deploy, not v1 dev).
#
# The frontend service isn't wired yet (see RAV-1's frontend half, a
# separate branch) - `db` + `backend` only for now.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # :Z relabels the bind mount for the container's SELinux context -
      # required on SELinux-enforcing hosts (e.g. Fedora) under rootless
      # Podman, otherwise the "node" user gets EACCES reading /app despite
      # correct Unix permissions. Docker on non-SELinux hosts ignores it.
      - ./backend:/app:Z
      # Everything the container writes lives in named volumes, never on the
      # bind-mounted source. Compose runtimes disagree on bind-mount
      # ownership: Docker maps the container "node" user (UID 1000) to the
      # host user, but rootless Podman (school-lab setup) maps the host user
      # to container root, leaving "node" unable to write into /app. Named
      # volumes are chowned to the image user by both, so tsc/nest can
      # always write dist/ and its .tsbuildinfo. (nest-cli.json keeps
      # deleteOutDir:false because /app/dist is a mount point here and can't
      # be rmdir'd - the prod build stage has a plain dir.)
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  backend_node_modules:
  backend_dist:
