name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # npm's install-scripts allowlist blocks @prisma/client's postinstall
      # (would otherwise run `prisma generate`) - same issue as the
      # Dockerfile hit, see docs/lessons.md. Without this, the generated
      # client's types fall back to `any`, and the lint step below fails on
      # every call site as "unsafe any usage" instead of a real type error.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: npm run format:check
      - run: npm run lint:check
      - run: npx tsc --noEmit
      - run: npm run test
      # No DATABASE_URL env needed here: test/setup-env.ts falls back to a
      # placeholder when unset (see docs/lessons.md) - it's never actually
      # connected to, since PrismaService is mocked in every e2e spec.
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      # No separate typecheck step: build already gates on `tsc -b` before
      # `vite build` runs, so a standalone tsc pass here would just
      # duplicate it. `make typecheck-frontend` still exists for local use.
      - run: npm run build
