name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-action reads the PR's commits via the API on pull_request runs;
# the default GITHUB_TOKEN needs these to be granted explicitly.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
