title = "ravito gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives, not real secrets"
regexes = [
  # NestJS CLI's generated README used to ship a fake CircleCI badge URL
  # (?token=abc123def456) as a placeholder, not a real credential. Already
  # removed from backend/README.md, but the allowlist also covers it in
  # the commit that first introduced it (RAV-1).
  '''nestjs/nest/master\?token=abc123def456''',
]
